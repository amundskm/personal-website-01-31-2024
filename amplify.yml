# AWS Amplify Hosting build spec (monorepo: only the Angular app in web/ is deployed).
# In the Amplify console, set the environment variable AMPLIFY_MONOREPO_APP_ROOT=web.
version: 1
applications:
  - appRoot: web
    backend:
      phases:
        build:
          commands:
            - nvm install 24 && nvm use 24
            # npm workspaces: install from the repo root
            - (cd .. && npm ci)
            # Deploys the Amplify Gen 2 backend (web/amplify: Cognito + members API) and
            # writes public/amplify_outputs.json, which the site loads at runtime
            - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID --outputs-out-dir public
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 24
        build:
          commands:
            # Prerenders every page, post and project currently published in Sanity
            - npm run build
      artifacts:
        baseDirectory: dist/web/browser
        files:
          - '**/*'
      cache:
        paths:
          - .angular/cache/**/*

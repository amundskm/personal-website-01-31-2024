# AWS Amplify Hosting build spec (monorepo: only the Angular app in web/ is deployed).
# In the Amplify console, set the environment variable AMPLIFY_MONOREPO_APP_ROOT=web.
version: 1
applications:
  - appRoot: web
    backend:
      phases:
        build:
          commands:
            # Skip the build image's default global packages (old Amplify CLI, Vue 2, …): unused, slow and noisy
            - nvm install 24 --skip-default-packages && nvm use 24
            # npm workspaces: install from the repo root
            - (cd .. && npm ci)
            # Deploys the Amplify Gen 2 backend (web/amplify: Cognito + members API) and
            # writes public/amplify_outputs.json, which the site loads at runtime
            - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID --outputs-out-dir public
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 24
        build:
          commands:
            # This branch's content API (the Rails app in api/), set per branch under
            # Hosting → Environment variables. Prerendering reads every page, post and
            # project from it, so the build fails if it's missing or unreachable.
            - if [ -z "$CONTENT_API_URL" ]; then echo "Set the CONTENT_API_URL environment variable for this branch" >&2; exit 1; fi
            - npm run build -- --define "CONTENT_API_URL=\"$CONTENT_API_URL\""
      artifacts:
        baseDirectory: dist/web/browser
        files:
          - '**/*'
      cache:
        paths:
          - .angular/cache/**/*

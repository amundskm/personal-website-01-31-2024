# Checks every pull request into qa or main. The rulesets on qa and main
# require these jobs to pass before merging.
name: CI

on:
  pull_request:
    branches: [qa, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  from-qa:
    name: from-qa
    runs-on: ubuntu-latest
    steps:
      - name: main only takes changes that went through qa
        if: >-
          github.base_ref == 'main' &&
          (github.head_ref != 'qa' || github.event.pull_request.head.repo.full_name != github.repository)
        run: |
          echo "::error::Changes reach main only through qa: open this pull request into qa, then one from qa into main."
          exit 1
      - run: echo "OK"

  web-tests:
    name: web-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  api-tests:
    name: api-tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: api
          POSTGRES_PASSWORD: api
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U api" --health-interval 2s --health-retries 15
    env:
      RAILS_ENV: test
      DB_HOST: localhost
      DB_USER: api
      DB_PASSWORD: api
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install --no-install-recommends -y libvips42t64
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: api
          bundler-cache: true
      - run: bin/rails db:prepare
      - run: bin/rails test

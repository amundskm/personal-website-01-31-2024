# Checks every pull request into qa; the ruleset on qa requires these jobs
# to pass (and the branch to be up to date with qa) before merging. main
# only takes approved releases (see qa.yml), never pull requests.
name: CI

on:
  pull_request:
    branches: [qa]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  web-tests:
    name: web-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  api-tests:
    name: api-tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: api
          POSTGRES_PASSWORD: api
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U api" --health-interval 2s --health-retries 15
    env:
      RAILS_ENV: test
      DB_HOST: localhost
      DB_USER: api
      DB_PASSWORD: api
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -qq && sudo apt-get install --no-install-recommends -y libvips42t64
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: api
          bundler-cache: true
      - run: bin/rails db:prepare
      - run: bin/rails test
